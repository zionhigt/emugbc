<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1060" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="mAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="mViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="mGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#fca5a5" stroke-width="4"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1160" height="1060" fill="#ffffff"/>

  <text x="580" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">Le timer — image mentale</text>
  <text x="580" y="70" text-anchor="middle" font-size="14" fill="#64748b">reconstruite depuis les questions : de « une ancre et une période » à « une grille et un signal »</text>

  <!-- ══════════════ 1 · LE COMPTEUR ══════════════ -->
  <text x="40" y="120" font-size="17" font-weight="700" fill="#5b21b6">1 · Un seul compteur — DIV n'en est qu'une fenêtre</text>

  <text x="242" y="152" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7c3aed">DIV (0xFF04) = bits 15-8</text>
  <path d="M 90 158 L 394 158" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <path d="M 90 158 L 90 168" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <path d="M 394 158 L 394 168" fill="none" stroke="#7c3aed" stroke-width="2"/>

  <rect x="90" y="170" width="304" height="46" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <rect x="394" y="170" width="304" height="46" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="94" y="199" font-size="11.5" font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#5b21b6">15 14 13 12 11 10</text>
  <text x="330" y="199" font-size="11.5" font-family="'Consolas','DejaVu Sans Mono',monospace" font-weight="700" fill="#5b21b6">9</text>
  <text x="360" y="199" font-size="11.5" font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#5b21b6">8</text>
  <text x="400" y="199" font-size="11.5" font-family="'Consolas','DejaVu Sans Mono',monospace" font-weight="700" fill="#334155">7</text>
  <text x="432" y="199" font-size="11.5" font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#334155">6</text>
  <text x="464" y="199" font-size="11.5" font-family="'Consolas','DejaVu Sans Mono',monospace" font-weight="700" fill="#334155">5</text>
  <text x="496" y="199" font-size="11.5" font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#334155">4</text>
  <text x="528" y="199" font-size="11.5" font-family="'Consolas','DejaVu Sans Mono',monospace" font-weight="700" fill="#334155">3</text>
  <text x="560" y="199" font-size="11.5" font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#334155">2</text>
  <text x="592" y="199" font-size="11.5" font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#334155">1</text>
  <text x="624" y="199" font-size="11.5" font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#334155">0</text>
  <text x="740" y="185" font-size="12.5" fill="#64748b">compteur 16 bits, incrémenté</text>
  <text x="740" y="203" font-size="12.5" fill="#64748b">à chaque T-cycle</text>

  <!-- prises -->
  <path d="M 334 218 L 334 250" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#mAmber)"/>
  <path d="M 404 218 L 404 250" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#mAmber)"/>
  <path d="M 468 218 L 468 250" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#mAmber)"/>
  <path d="M 532 218 L 532 250" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#mAmber)"/>
  <text x="334" y="268" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b45309">bit 9</text>
  <text x="404" y="268" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b45309">bit 7</text>
  <text x="468" y="268" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b45309">bit 5</text>
  <text x="532" y="268" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b45309">bit 3</text>
  <text x="334" y="284" text-anchor="middle" font-size="10.5" fill="#94a3b8">1024 T</text>
  <text x="404" y="284" text-anchor="middle" font-size="10.5" fill="#94a3b8">256 T</text>
  <text x="468" y="284" text-anchor="middle" font-size="10.5" fill="#94a3b8">64 T</text>
  <text x="532" y="284" text-anchor="middle" font-size="10.5" fill="#94a3b8">16 T</text>

  <rect x="700" y="240" width="420" height="56" fill="#fefce8" stroke="#eab308" stroke-width="1.5" rx="6"/>
  <text x="712" y="262" font-size="12" fill="#854d0e">Une seule des 4 prises (bit 9) est visible en lisant DIV.</text>
  <text x="712" y="281" font-size="12" fill="#854d0e">Les trois autres sont sous la fenêtre — réelles, invisibles.</text>

  <!-- la grille -->
  <text x="40" y="332" font-size="14" font-weight="700" fill="#0f172a">la grille — les fronts descendants du bit choisi</text>
  <line x1="90" y1="382" x2="1000" y2="382" stroke="#cbd5e1" stroke-width="2"/>
  <g stroke="#7c3aed" stroke-width="3">
    <line x1="90" y1="358" x2="90" y2="400"/>
    <line x1="242" y1="358" x2="242" y2="400"/>
    <line x1="394" y1="358" x2="394" y2="400"/>
    <line x1="546" y1="358" x2="546" y2="400"/>
    <line x1="698" y1="358" x2="698" y2="400"/>
    <line x1="850" y1="358" x2="850" y2="400"/>
  </g>
  <text x="90" y="418" text-anchor="middle" font-size="11" font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#64748b">0</text>
  <text x="242" y="418" text-anchor="middle" font-size="11" font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#64748b">P</text>
  <text x="394" y="418" text-anchor="middle" font-size="11" font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#64748b">2P</text>
  <text x="546" y="418" text-anchor="middle" font-size="11" font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#64748b">3P</text>
  <text x="698" y="418" text-anchor="middle" font-size="11" font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#64748b">4P</text>
  <text x="850" y="418" text-anchor="middle" font-size="11" font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#64748b">5P</text>

  <rect x="700" y="326" width="420" height="24" fill="#f1f5f9" rx="4"/>
  <text x="710" y="343" font-size="12" font-style="italic" fill="#475569">« qu'est-ce que tu appelles la grille ? » — la question pivot</text>

  <text x="90" y="444" font-size="12.5" fill="#dc2626">Elle est absolue. Aucune écriture ne la déplace : ni TIMA, ni TAC, ni TMA.</text>
  <text x="90" y="462" font-size="12.5" fill="#64748b">C'est ce qui a tué `anchor` — une grille privée qui démarrait à l'instant de l'écriture.</text>

  <!-- ══════════════ 2 · LE SIGNAL ══════════════ -->
  <line x1="40" y1="492" x2="1120" y2="492" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="524" font-size="17" font-weight="700" fill="#5b21b6">2 · Le multiplexeur et le signal</text>

  <g font-size="11.5" font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#b45309" text-anchor="end">
    <text x="180" y="560">bit 9</text>
    <text x="180" y="590">bit 7</text>
    <text x="180" y="620">bit 5</text>
    <text x="180" y="650">bit 3</text>
  </g>
  <g fill="none" stroke="#d97706" stroke-width="2">
    <path d="M 190 556 L 300 590"/>
    <path d="M 190 586 L 300 597"/>
    <path d="M 190 616 L 300 604"/>
    <path d="M 190 646 L 300 611"/>
  </g>

  <path d="M 300 556 L 350 578 L 350 622 L 300 644 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="325" y="606" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">mux</text>
  <path d="M 325 690 L 325 650" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#mGray)"/>
  <text x="325" y="708" text-anchor="middle" font-size="11.5" font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#475569">TAC bits 1-0</text>

  <path d="M 350 600 L 430 600" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <path d="M 430 570 L 430 630 A 30 30 0 0 0 430 570 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="447" y="605" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">ET</text>
  <path d="M 325 750 L 325 726" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 325 750 L 447 750 L 447 632" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#mGray)"/>
  <text x="470" y="754" font-size="11.5" font-family="'Consolas','DejaVu Sans Mono',monospace" fill="#475569">TAC bit 2 (activation)</text>

  <path d="M 490 600 L 590 600" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#mViolet)"/>
  <rect x="592" y="578" width="150" height="44" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5" rx="6"/>
  <text x="667" y="606" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">le signal</text>

  <rect x="770" y="540" width="350" height="130" fill="#fefce8" stroke="#eab308" stroke-width="1.5" rx="6"/>
  <text x="784" y="564" font-size="12.5" font-weight="700" fill="#854d0e">L'analogie du joypad, corrigée</text>
  <text x="784" y="588" font-size="12" fill="#854d0e">Le joypad multiplexe sa SORTIE : il choisit</text>
  <text x="784" y="606" font-size="12" fill="#854d0e">ce qu'on observe sur les mêmes broches.</text>
  <text x="784" y="630" font-size="12" fill="#854d0e">Le timer multiplexe son ENTRÉE d'horloge :</text>
  <text x="784" y="648" font-size="12" fill="#854d0e">il choisit ce qui le cadence. Un seul TIMA.</text>

  <text x="592" y="700" font-size="12.5" fill="#dc2626">Le signal a deux entrées — c'est pour ça qu'éteindre le timer produit un front,</text>
  <text x="592" y="718" font-size="12.5" fill="#dc2626">sans que le compteur ait bougé d'un cycle.</text>

  <!-- ══════════════ 3 · LA CASCADE ══════════════ -->
  <line x1="40" y1="782" x2="1120" y2="782" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="814" font-size="17" font-weight="700" fill="#5b21b6">3 · Deux détecteurs de front en cascade</text>
  <text x="40" y="836" font-size="12.5" font-style="italic" fill="#475569">« l'interruption se fait sur l'effondrement du bit 7 de TIMA ? » — le même primitif, un étage plus haut</text>

  <rect x="60" y="858" width="200" height="58" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" rx="6"/>
  <text x="160" y="882" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b21b6">le signal tombe</text>
  <text x="160" y="902" text-anchor="middle" font-size="12" fill="#5b21b6">1 vers 0</text>

  <path d="M 266 887 L 316 887" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#mViolet)"/>

  <rect x="322" y="858" width="200" height="58" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" rx="6"/>
  <text x="422" y="882" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b21b6">TIMA++</text>
  <text x="422" y="902" text-anchor="middle" font-size="12" fill="#5b21b6">un cran de plus</text>

  <path d="M 528 887 L 578 887" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#mViolet)"/>

  <rect x="584" y="858" width="220" height="58" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="6"/>
  <text x="694" y="882" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">bit 7 de TIMA tombe</text>
  <text x="694" y="902" text-anchor="middle" font-size="12" fill="#b45309">0xFF vers 0x00</text>

  <path d="M 810 887 L 860 887" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#mAmber)"/>

  <rect x="866" y="858" width="230" height="58" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="6"/>
  <text x="981" y="882" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">IF bit 2 levé</text>
  <text x="981" y="902" text-anchor="middle" font-size="12" fill="#b91c1c">TIMA = TMA (une copie)</text>

  <text x="60" y="946" font-size="12.5" fill="#64748b">TMA est une <tspan font-weight="700" fill="#0f172a">valeur qu'on copie</tspan>. `256 - TMA` est une <tspan font-weight="700" fill="#0f172a">distance qu'on déduit</tspan> — le matériel ne la calcule jamais.</text>

  <!-- ══════════════ 4 · LE MUR ══════════════ -->
  <rect x="60" y="968" width="1036" height="66" fill="url(#hatch)" opacity="0.25" rx="6"/>
  <rect x="60" y="968" width="1036" height="66" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 4" rx="6"/>
  <text x="78" y="994" font-size="13.5" font-weight="700" fill="#b91c1c">4 · Le mur — la fenêtre de 4 T-cycles</text>
  <text x="78" y="1016" font-size="12" fill="#7f1d1d">Pas un problème de timer : la machine avance par instruction entière, elle ignore à quel T-cycle une écriture est tombée.</text>
</svg>
